name: Greeting RSS Auto Feeder

on:
  schedule:
    # 毎日3時間おきに実行（更新されるまで自動チェックし続け、更新後はPython側で自動停止します）
    - cron: '0 */3 * * *'

  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run greeting scraper
        run: |
          python greeting_scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add greeting_rss.xml greeting_state.json greeting_images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update greeting RSS and images [skip ci]" && git push)
