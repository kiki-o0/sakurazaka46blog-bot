name: Greeting RSS Auto Feeder

on:
  schedule:
    # ユーザー様のご要望に合わせたJSTスケジュール（UTCに変換して設定）
    # 1. 月末の 23:00 JST (毎日 14:00 UTC)
    - cron: '0 14 * * *'
    
    # 2. 1日の 0時, 1時 JST (前日31日/当月1日の 15:00, 16:00 UTC)
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    
    # 3. 1日の 9時〜12時 JST (当月1日の 0:00〜3:00 UTC)
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    
    # 4. 1日の 18時〜22時 JST (当月1日の 9:00〜13:00 UTC)
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    
    # 5. 2日の 0時 JST (1日の 15:00 UTC / 最終確認用)
    # ※ 1日の15:00 UTCは上記の `0 15 * * *` に含まれるため自動的にカバーされます

  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run greeting scraper
        run: |
          python greeting_scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add greeting_rss.xml greeting_state.json greeting_images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update greeting RSS and images [skip ci]" && git push)
