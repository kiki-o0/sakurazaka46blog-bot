name: Instagram取得テスト

on:
  workflow_dispatch:

jobs:
  test-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install curl_cffi

      - name: Instagram取得テスト
        env:
          INSTA_COOKIE: ${{ secrets.INSTA_COOKIE }}
        run: python -u insta_check.py
