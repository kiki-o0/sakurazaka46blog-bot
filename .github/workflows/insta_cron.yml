name: Instagram Checker All

on:
  schedule:
    - cron:

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-checker-all
  cancel-in-progress: false

jobs:
  check:
    name: Check all Instagram RSS feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run RSS Instagram checker
        env:
          WEBHOOK_AIRI: ${{ secrets.WEBHOOK_AIRI }}
          WEBHOOK_AKIHO: ${{ secrets.WEBHOOK_AKIHO }}
          WEBHOOK_HIKARI: ${{ secrets.WEBHOOK_HIKARI }}
          WEBHOOK_HONO: ${{ secrets.WEBHOOK_HONO }}
          WEBHOOK_KARIN: ${{ secrets.WEBHOOK_KARIN }}
          WEBHOOK_MIU: ${{ secrets.WEBHOOK_MIU }}
          WEBHOOK_MINAMI: ${{ secrets.WEBHOOK_MINAMI }}
          WEBHOOK_REI: ${{ secrets.WEBHOOK_REI }}
          WEBHOOK_REINA_O: ${{ secrets.WEBHOOK_REINA_O }}
          WEBHOOK_RENA: ${{ secrets.WEBHOOK_RENA }}
          WEBHOOK_RIKA: ${{ secrets.WEBHOOK_RIKA }}
          WEBHOOK_RIKO: ${{ secrets.WEBHOOK_RIKO }}
          WEBHOOK_RINA_I: ${{ secrets.WEBHOOK_RINA_I }}
          WEBHOOK_RINA_M: ${{ secrets.WEBHOOK_RINA_M }}
          WEBHOOK_TEN: ${{ secrets.WEBHOOK_TEN }}
          WEBHOOK_YUI: ${{ secrets.WEBHOOK_YUI }}
          WEBHOOK_YUMIKO: ${{ secrets.WEBHOOK_YUMIKO }}
          WEBHOOK_YU: ${{ secrets.WEBHOOK_YU }}
          WEBHOOK_YUUKA: ${{ secrets.WEBHOOK_YUUKA }}
          WEBHOOK_YUZUKI: ${{ secrets.WEBHOOK_YUZUKI }}

        run: python insta_check.py

      - name: Verify history file
        id: history
        run: |
          if [ ! -f insta_history.json ]; then
            echo "insta_history.jsonが作成されていません"
            exit 1
          fi

          if git diff --quiet -- insta_history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "履歴に変更はありません"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "履歴に変更があります"
          fi

      - name: Commit and push history
        if: steps.history.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add insta_history.json
          git commit -m "Update Instagram history [skip ci]"
          git push
