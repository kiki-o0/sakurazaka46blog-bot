name: Instagram Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi requests

      - name: Run Instagram monitor
        env:
          INSTA_COOKIE: ${{ secrets.INSTA_COOKIE }}
          WEBHOOK_TEN: ${{ secrets.WEBHOOK_TEN }}
          WEBHOOK_AIRI: ${{ secrets.WEBHOOK_AIRI }}
          WEBHOOK_RINA_I: ${{ secrets.WEBHOOK_RINA_I }}
          WEBHOOK_HIKARI: ${{ secrets.WEBHOOK_HIKARI }}
          WEBHOOK_REI: ${{ secrets.WEBHOOK_REI }}
          WEBHOOK_AKIHO: ${{ secrets.WEBHOOK_AKIHO }}
          WEBHOOK_YUMIKO: ${{ secrets.WEBHOOK_YUMIKO }}
          WEBHOOK_YUI: ${{ secrets.WEBHOOK_YUI }}
          WEBHOOK_HONO: ${{ secrets.WEBHOOK_HONO }}
          WEBHOOK_KARIN: ${{ secrets.WEBHOOK_KARIN }}
          WEBHOOK_RINA_M: ${{ secrets.WEBHOOK_RINA_M }}
          WEBHOOK_RENA: ${{ secrets.WEBHOOK_RENA }}
          WEBHOOK_RIKA: ${{ secrets.WEBHOOK_RIKA }}
          WEBHOOK_RIKO: ${{ secrets.WEBHOOK_RIKO }}
          WEBHOOK_REINA_O: ${{ secrets.WEBHOOK_REINA_O }}
          WEBHOOK_YUZUKI: ${{ secrets.WEBHOOK_YUZUKI }}
          WEBHOOK_YU: ${{ secrets.WEBHOOK_YU }}
          WEBHOOK_MIU: ${{ secrets.WEBHOOK_MIU }}
          WEBHOOK_MINAMI: ${{ secrets.WEBHOOK_MINAMI }}
          WEBHOOK_YUUKA: ${{ secrets.WEBHOOK_YUUKA }}
        run: python main.py

      - name: Save history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Instagram history [skip ci]"
          file_pattern: "insta_history.json"
