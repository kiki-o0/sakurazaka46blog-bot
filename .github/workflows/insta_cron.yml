name: Instagram Checker All

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-checker-all
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests curl_cffi

      - name: Run Instagram checker
        env:
          INSTA_COOKIE: ${{ secrets.INSTA_COOKIE }}

          WEBHOOK_ENDO_H: ${{ secrets.WEBHOOK_ENDO_H }}
          WEBHOOK_OZONO: ${{ secrets.WEBHOOK_OZONO }}
          WEBHOOK_ONUMA: ${{ secrets.WEBHOOK_ONUMA }}
          WEBHOOK_SEKI: ${{ secrets.WEBHOOK_SEKI }}
          WEBHOOK_TAKEMOTO: ${{ secrets.WEBHOOK_TAKEMOTO }}
          WEBHOOK_TAMURA: ${{ secrets.WEBHOOK_TAMURA }}
          WEBHOOK_FUJIYOSHI: ${{ secrets.WEBHOOK_FUJIYOSHI }}
          WEBHOOK_MATSUDA: ${{ secrets.WEBHOOK_MATSUDA }}
          WEBHOOK_MORIYA: ${{ secrets.WEBHOOK_MORIYA }}
          WEBHOOK_YAMASAKI: ${{ secrets.WEBHOOK_YAMASAKI }}
          WEBHOOK_ISHIMORI: ${{ secrets.WEBHOOK_ISHIMORI }}
          WEBHOOK_ENDO_R: ${{ secrets.WEBHOOK_ENDO_R }}
          WEBHOOK_ODAKURA: ${{ secrets.WEBHOOK_ODAKURA }}
          WEBHOOK_TANIGUCHI: ${{ secrets.WEBHOOK_TANIGUCHI }}
          WEBHOOK_NAKASHIMA: ${{ secrets.WEBHOOK_NAKASHIMA }}
          WEBHOOK_MURAI: ${{ secrets.WEBHOOK_MURAI }}
          WEBHOOK_MURAYAMA: ${{ secrets.WEBHOOK_MURAYAMA }}
          WEBHOOK_MIICHAN: ${{ secrets.WEBHOOK_MIICHAN }}
          WEBHOOK_SUGAI: ${{ secrets.WEBHOOK_SUGAI }}

        run: python insta_checker.py

      - name: Check history changes
        id: history
        run: |
          if git diff --quiet -- insta_history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "insta_history.jsonに変更はありません"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "insta_history.jsonに変更があります"
          fi

      - name: Commit and push history
        if: steps.history.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add insta_history.json
          git commit -m "Update Instagram history [skip ci]"
          git push
