name: Instagram RSS Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Run Instagram RSS test
        env:
          WEBHOOK_TEST_TEN: ${{ secrets.WEBHOOK_TEST_TEN }}
        run: python -u test_ten.py
