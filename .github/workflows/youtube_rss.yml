name: Generate YouTube RSS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python generate_youtube_rss.py

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube_official_rss.xml youtube_sakurazaka_channel_rss.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update YouTube RSS" && git push)
